name: Update latest YouTube videos

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-youtube-latest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read the official channel feed
        run: node scripts/update-youtube.mjs
      - name: Commit changed data only
        run: |
          if git diff --quiet -- assets/youtube-latest.json; then
            echo "No new videos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/youtube-latest.json
          git commit -m "chore(content): refresh latest YouTube videos"
          git push
